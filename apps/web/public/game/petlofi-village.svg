<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="PetLofi village game map">
  <!--
    Guardrail: water and shoreline shapes are procedural vector paths, not atlas tiles.
    The current JPEG source sheets crop with visible halos at tile edges. Swap these
    paths for cleaned transparent PNG water-edge tiles only after the source assets
    are re-exported without halos.
  -->
  <defs>
    <pattern id="grass" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#14a36a"/>
      <path d="M0 8h48M0 24h48M0 40h48" stroke="#0f8f5d" stroke-width="3" opacity=".38"/>
      <path d="M8 4l5 7M29 15l4 8M43 31l-6 6M17 39l4-7" stroke="#44c779" stroke-width="2" opacity=".65"/>
      <circle cx="10" cy="28" r="1.5" fill="#e8ffd6" opacity=".6"/>
      <circle cx="34" cy="6" r="1.2" fill="#0a6845" opacity=".65"/>
      <circle cx="41" cy="42" r="1.4" fill="#0a6845" opacity=".45"/>
    </pattern>
    <pattern id="dirt" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#e7d0a1"/>
      <circle cx="16" cy="18" r="7" fill="#c9a873" opacity=".28"/>
      <circle cx="54" cy="34" r="5" fill="#b9935d" opacity=".22"/>
      <circle cx="32" cy="58" r="2.2" fill="#fff2c0" opacity=".48"/>
      <path d="M0 16c18 8 36 8 72 0M0 44c22 8 46 7 72-2" fill="none" stroke="#d8bc87" stroke-width="2" opacity=".4"/>
    </pattern>
    <pattern id="stone" width="34" height="28" patternUnits="userSpaceOnUse">
      <rect width="34" height="28" fill="#aeb7ad"/>
      <circle cx="8" cy="8" r="7" fill="#cbd0c7"/>
      <circle cx="25" cy="14" r="8" fill="#9ba79f"/>
      <circle cx="13" cy="25" r="6" fill="#c2c8bf"/>
      <path d="M0 18h34M18 0v28" stroke="#7f8b84" stroke-width="1" opacity=".42"/>
    </pattern>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0" stop-color="#3c9bef"/>
      <stop offset="1" stop-color="#5ac7ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="9" dy="12" stdDeviation="0" flood-color="#06121a" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#06121a" flood-opacity=".18"/>
    </filter>
    <g id="tree" filter="url(#soft)">
      <rect x="-8" y="28" width="16" height="42" rx="2" fill="#70401f"/>
      <circle cx="-20" cy="16" r="30" fill="#35a756"/>
      <circle cx="16" cy="11" r="32" fill="#3fba61"/>
      <circle cx="30" cy="45" r="25" fill="#247c43"/>
      <circle cx="-18" cy="49" r="28" fill="#2c914d"/>
      <circle cx="4" cy="34" r="34" fill="#38a956"/>
    </g>
    <g id="rock">
      <path d="M-28 12c3-22 23-32 46-24 15 5 24 19 19 35-20 8-42 9-65-11z" fill="#cdd3ca"/>
      <path d="M-6-10c16 3 27 14 24 27-10 3-24 4-38 1 4-11 8-19 14-28z" fill="#e4e6dd" opacity=".7"/>
      <path d="M-28 12c24 19 51 16 65 11-6 12-24 20-43 18-18-2-30-13-22-29z" fill="#88958f" opacity=".7"/>
    </g>
    <g id="flowers">
      <path d="M0 22v-30M-14 18l11-25M16 17 6-8" stroke="#2ea966" stroke-width="4"/>
      <circle cx="-16" cy="-8" r="5" fill="#fff7ad"/>
      <circle cx="3" cy="-15" r="5" fill="#fff7ad"/>
      <circle cx="18" cy="-5" r="5" fill="#fff7ad"/>
    </g>
    <g id="crystal">
      <path d="M0-42 24-10 13 43h-28l-12-53z" fill="#4edbd2"/>
      <path d="M0-42 4 42h-19l-12-52z" fill="#d9ffff" opacity=".55"/>
      <path d="M4-34 24-10 13 43 4 42z" fill="#2771e7" opacity=".5"/>
    </g>
    <g id="crate">
      <rect x="-22" y="-22" width="44" height="44" fill="#b67339" stroke="#442918" stroke-width="5"/>
      <path d="M-20-20 20 20M20-20-20 20" stroke="#442918" stroke-width="5"/>
    </g>
    <g id="house-blue" filter="url(#shadow)">
      <ellipse cx="0" cy="83" rx="92" ry="20" fill="#06121a" opacity=".22"/>
      <ellipse cx="0" cy="72" rx="78" ry="28" fill="url(#stone)" opacity=".85"/>
      <path d="M-64 12h128v76H-64z" fill="#eee7cd" stroke="#10231b" stroke-width="7"/>
      <path d="M-86 13 0-58l86 71v26H-86z" fill="#42a5ff" stroke="#10231b" stroke-width="7"/>
      <path d="M-77 15h154" stroke="#7dd0ff" stroke-width="8" opacity=".5"/>
      <path d="M-43 17v68M42 17v68M-60 27 60 83M60 27-60 83" stroke="#7b4d2e" stroke-width="8" opacity=".88"/>
      <rect x="-46" y="31" width="25" height="25" fill="#fff2a0" stroke="#5a351d" stroke-width="5"/>
      <rect x="22" y="31" width="25" height="25" fill="#fff2a0" stroke="#5a351d" stroke-width="5"/>
      <path d="M-16 88V48c0-16 32-16 32 0v40z" fill="#805033" stroke="#5a351d" stroke-width="7"/>
    </g>
    <g id="house-red" filter="url(#shadow)">
      <ellipse cx="0" cy="110" rx="112" ry="24" fill="#06121a" opacity=".22"/>
      <ellipse cx="0" cy="96" rx="98" ry="34" fill="url(#stone)" opacity=".85"/>
      <path d="M-78 18h156v100H-78z" fill="#eadbc8" stroke="#10231b" stroke-width="8"/>
      <path d="M-110 20 0-88 110 20v34H-110z" fill="#a76075" stroke="#10231b" stroke-width="8"/>
      <path d="M-76 21v95M76 21v95M-46 24v92M45 24v92M-80 46 80 112M80 46-80 112" stroke="#7b4d2e" stroke-width="9" opacity=".9"/>
      <rect x="-58" y="45" width="30" height="30" fill="#fff2a0" stroke="#5a351d" stroke-width="6"/>
      <rect x="28" y="45" width="30" height="30" fill="#fff2a0" stroke="#5a351d" stroke-width="6"/>
      <path d="M-24 118V58c0-22 48-22 48 0v60z" fill="#2f2926" stroke="#5a351d" stroke-width="8"/>
      <rect x="-42" y="13" width="84" height="18" fill="#bf7d4b" stroke="#5a351d" stroke-width="5"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#grass)"/>
  <path d="M-160 920C80 820 190 940 330 930c170-12 240-180 390-170 164 12 186 190 370 180 173-10 225-180 406-144 139 28 196 152 424 98v310H-160z" fill="url(#water)" opacity=".92"/>
  <path d="M-110 842c254-24 461-55 703-44 238 10 486 18 777-70 234-71 371-17 660-31v126c-331-3-465-44-693 34-255 87-510 85-764 73-244-11-422 27-683 46z" fill="url(#dirt)"/>
  <path d="M896-130c94 290 44 472-4 624-54 170-18 336 66 586H830c-83-237-96-422-45-585 46-147 91-313 4-625z" fill="url(#dirt)"/>
  <path d="M750 520c95-126 368-166 488-40 125 132 36 326-168 361-191 33-415-34-396-167 7-47 36-102 76-154z" fill="url(#dirt)" opacity=".98"/>
  <path d="M1314 432c114-142 376-214 626-231v469c-224 44-458 13-580-105-47-46-73-88-46-133z" fill="url(#dirt)" opacity=".98"/>
  <path d="M342 1004c34-149 248-253 433-200 169 48 209 171 124 276H342z" fill="url(#dirt)" opacity=".9"/>
  <path d="M748 520c103-76 292-92 432-23M676 668c166 82 448 61 545-60M1320 431c125-62 324-98 520-118M-80 887c274-22 511-72 853-55" fill="none" stroke="#c5aa79" stroke-width="5" opacity=".3"/>
  <use href="#house-blue" x="548" y="338" transform="scale(1.18)"/>
  <use href="#house-red" x="1274" y="325" transform="scale(.95)"/>
  <use href="#house-blue" x="1374" y="675" transform="scale(1.05)"/>
  <use href="#house-blue" x="431" y="741" transform="scale(.98)"/>
  <use href="#house-blue" x="984" y="539" transform="scale(.95)"/>
  <use href="#house-blue" x="650" y="942" transform="scale(.95)"/>
  <use href="#house-blue" x="1458" y="910" transform="scale(.98)"/>
  <use href="#tree" x="1126" y="228" transform="scale(1.25)"/>
  <use href="#tree" x="1542" y="401" transform="scale(1)"/>
  <use href="#tree" x="1143" y="960" transform="scale(1.35)"/>
  <use href="#tree" x="494" y="467" transform="scale(.8)"/>
  <use href="#tree" x="1665" y="842" transform="scale(1.05)"/>
  <use href="#rock" x="340" y="574" transform="scale(.85)"/>
  <use href="#rock" x="1013" y="924" transform="scale(.9)"/>
  <use href="#rock" x="1692" y="550" transform="scale(.75)"/>
  <use href="#flowers" x="820" y="272" transform="scale(.75)"/>
  <use href="#flowers" x="1267" y="725" transform="scale(.7)"/>
  <use href="#flowers" x="1605" y="704" transform="scale(.72)"/>
  <use href="#crate" x="790" y="814" transform="scale(.72)"/>
  <use href="#crate" x="1222" y="884" transform="scale(.8)"/>
  <use href="#crystal" x="770" y="390" transform="scale(.65)"/>
  <use href="#crystal" x="1494" y="735" transform="scale(.72)"/>
  <use href="#crystal" x="1611" y="290" transform="scale(.5)"/>
  <rect x="832" y="211" width="45" height="20" rx="10" fill="#a76535" stroke="#56331e" stroke-width="5"/>
  <rect x="1165" y="804" width="26" height="32" rx="10" fill="#b8793c" stroke="#56331e" stroke-width="5"/>
  <path d="M462 1000c10-37 49-51 75-19-8 36-47 51-75 19z" fill="#d98b4d" stroke="#6f4527" stroke-width="4"/>
</svg>
